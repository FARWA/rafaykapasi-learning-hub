<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Kid Racer</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background: linear-gradient(to bottom, #4a90e2, #50e3c2);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Scenery Elements */
        .sky {
            position: absolute;
            top: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            z-index: 1;
        }

        .sun {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffeb3b;
        }

        .mountains {
            position: absolute;
            bottom: 60%;
            width: 200%;
            height: 100px;
            background: repeating-linear-gradient(
                135deg,
                #2c3e50,
                #2c3e50 40px,
                #34495e 40px,
                #34495e 80px
            );
            z-index: 2;
            animation: scrollMountains 20s linear infinite;
        }

        @keyframes scrollMountains {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .scenery-side {
            position: absolute;
            top: 0;
            width: 20%;
            height: 100%;
            background: #27ae60;
            z-index: 3;
        }

        .scenery-side.left { left: 0; border-right: 6px dashed #f1c40f; }
        .scenery-side.right { right: 0; border-left: 6px dashed #f1c40f; }

        .road {
            position: absolute;
            top: 0;
            left: 20%;
            width: 60%;
            height: 100%;
            background: #333;
            z-index: 4;
            overflow: hidden;
        }

        .road-stripe {
            position: absolute;
            width: 8px;
            height: 80px;
            background: #fff;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Game Entities */
        .entity {
            position: absolute;
            z-index: 5;
            transition: transform 0.1s ease-out;
        }

        /* Player Car */
        .car {
            width: 50px;
            height: 90px;
            background: #e74c3c;
            border-radius: 10px;
            position: absolute;
            bottom: 30px;
            left: calc(50% - 25px);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .car .roof {
            position: absolute;
            top: 25px;
            left: 5px;
            right: 5px;
            height: 40px;
            background: #c0392b;
            border-radius: 8px;
        }

        .car .windshield {
            position: absolute;
            top: 28px;
            left: 8px;
            right: 8px;
            height: 15px;
            background: #222;
            border-radius: 4px;
        }

        .car .headlight {
            position: absolute;
            top: 2px;
            width: 10px;
            height: 4px;
            background: #fff;
            box-shadow: 0 0 8px #fff;
        }
        .car .headlight.left { left: 5px; }
        .car .headlight.right { right: 5px; }

        .car .wheel {
            position: absolute;
            width: 8px;
            height: 18px;
            background: #111;
            border-radius: 3px;
        }
        .car .wheel.fl { top: 15px; left: -5px; }
        .car .wheel.fr { top: 15px; right: -5px; }
        .car .wheel.rl { bottom: 15px; left: -5px; }
        .car .wheel.rr { bottom: 15px; right: -5px; }

        /* Enemy Car Styles */
        .enemy-car {
            width: 50px;
            height: 90px;
            background: #3498db;
            border-radius: 10px;
            position: absolute;
            z-index: 8;
        }
        .enemy-car .roof {
            position: absolute;
            top: 25px; left: 5px; right: 5px; height: 40px;
            background: #2980b9; border-radius: 8px;
        }
        .enemy-car .windshield {
            position: absolute;
            top: 28px; left: 8px; right: 8px; height: 15px;
            background: #222; border-radius: 4px;
        }

        /* Collectibles & Powerups */
        .coin {
            width: 25px;
            height: 25px;
            background: #f1c40f;
            border-radius: 50%;
            position: absolute;
            z-index: 7;
            box-shadow: 0 0 10px #f39c12;
            animation: spinCoin 1s linear infinite;
        }
        @keyframes spinCoin {
            0% { transform: scaleX(1); }
            50% { transform: scaleX(0.2); }
            100% { transform: scaleX(1); }
        }

        .powerup {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            position: absolute;
            z-index: 7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
            box-shadow: 0 0 12px #fff;
        }
        .powerup.nitro { background: #e67e22; }
        .powerup.shield { background: #9b59b6; }
        .powerup.heart { background: #e74c3c; }

        /* UI Overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .screen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .screen p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #bdc3c7;
        }

        .btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.2s;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(46, 204, 113, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .hud-meters {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .meter-container {
            width: 120px;
            height: 12px;
            background: rgba(0,0,0,0.5);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .meter-fill {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width 0.2s;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .control-hint {
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #ecf0f1;
        }

        /* Pause Button */
        #pause-btn {
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 2px solid #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Screen Shake Effect */
        .shake {
            animation: shakeAnim 0.2s ease-in-out;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(8px, -5px); }
            60% { transform: translate(-5px, -3px); }
            80% { transform: translate(5px, 3px); }
            100% { transform: translate(0, 0); }
        }

        /* Hidden Utility */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Scenery and Environment -->
        <div class="sky"><div class="sun"></div></div>
        <div class="mountains"></div>
        <div class="scenery-side left"></div>
        <div class="scenery-side right"></div>
        
        <div class="road" id="road">
            <!-- Road stripes created via JS or CSS -->
        </div>

        <!-- Player -->
        <div class="car" id="player">
            <div class="roof"></div>
            <div class="windshield"></div>
            <div class="headlight left"></div>
            <div class="headlight right"></div>
            <div class="wheel fl"></div>
            <div class="wheel fr"></div>
            <div class="wheel rl"></div>
            <div class="wheel rr"></div>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-top">
                <div>
                    <div>Score: <span id="score-val">0</span></div>
                    <div>Coins: <span id="coin-val">0</span></div>
                </div>
                <div class="hud-meters">
                    <div style="font-size: 0.8rem;">FUEL</div>
                    <div class="meter-container"><div class="meter-fill" id="fuel-fill"></div></div>
                    <div style="font-size: 0.8rem; margin-top: 5px;">SHIELD</div>
                    <div class="meter-container"><div class="meter-fill" id="shield-fill" style="background:#9b59b6; width:0%;"></div></div>
                </div>
                <button id="pause-btn" onclick="game.togglePause()">II</button>
            </div>
            <div class="hud-bottom">
                <div class="control-hint">Use Arrow Keys / WASD to Steer</div>
                <div style="font-size: 1.5rem; font-weight: bold; color: #f1c40f;"><span id="speed-val">0</span> MPH</div>
            </div>
        </div>

        <!-- Main Menu Screen -->
        <div id="menu-screen" class="screen">
            <h1>TURBO KID</h1>
            <p>Endless Highway Racer</p>
            <button class="btn" onclick="game.start()">START GAME</button>
            <div style="margin-top: 20px; font-size: 0.9rem; color: #7f8c8d;">High Score: <span id="high-score-val">0</span></div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen hidden">
            <h1>PAUSED</h1>
            <button class="btn" onclick="game.togglePause()">RESUME</button>
            <button class="btn" style="background: #e74c3c;" onclick="game.restart()">RESTART</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1>GAME OVER</h1>
            <p>Your Car Crashed!</p>
            <p>Score: <span id="final-score">0</span></p>
            <button class="btn" onclick="game.restart()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Web Audio API Sound Generator
        class SoundManager {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playBeep(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            coin() { this.playBeep(900, 'sine', 0.15, 0.1); setTimeout(() => this.playBeep(1200, 'sine', 0.15, 0.1), 80); }
            crash() { this.playBeep(120, 'sawtooth', 0.5, 0.3); }
            click() { this.playBeep(600, 'sine', 0.05, 0.05); }
            powerup() { this.playBeep(400, 'triangle', 0.1, 0.1); setTimeout(() => this.playBeep(800, 'triangle', 0.2, 0.1), 100); }
        }

        // Game Core Class
        class Game {
            constructor() {
                this.sounds = new SoundManager();
                this.state = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER
                this.score = 0;
                this.coins = 0;
                this.highScore = localStorage.getItem('turbo_highscore') || 0;
                this.speed = 0;
                this.maxSpeed = 12;
                this.baseSpeed = 6;
                this.fuel = 100;
                this.shieldTime = 0;
                
                this.playerX = 0; // Relative to road center
                this.playerYPos = 0;
                this.roadWidth = 0;
                
                this.keys = {};
                this.obstacles = [];
                this.particles = [];
                this.roadOffset = 0;
                
                this.spawnTimer = 0;
                this.difficultyTimer = 0;

                this.initDOM();
                this.initListeners();
            }

            initDOM() {
                this.container = document.getElementById('game-container');
                this.roadEl = document.getElementById('road');
                this.playerEl = document.getElementById('player');
                this.hudEl = document.getElementById('hud');
                this.menuScreen = document.getElementById('menu-screen');
                this.pauseScreen = document.getElementById('pause-screen');
                this.gameOverScreen = document.getElementById('game-over-screen');
                
                this.scoreValEl = document.getElementById('score-val');
                this.coinValEl = document.getElementById('coin-val');
                this.speedValEl = document.getElementById('speed-val');
                this.fuelFillEl = document.getElementById('fuel-fill');
                this.shieldFillEl = document.getElementById('shield-fill');
                this.highScoreValEl = document.getElementById('high-score-val');
                this.finalScoreEl = document.getElementById('final-score');

                this.highScoreValEl.innerText = this.highScore;
                this.setupRoadStripes();
            }

            setupRoadStripes() {
                for (let i = 0; i < 10; i++) {
                    let stripe = document.createElement('div');
                    stripe.className = 'road-stripe';
                    stripe.style.top = (i * 120 - 50) + 'px';
                    this.roadEl.appendChild(stripe);
                }
            }

            initListeners() {
                window.addEventListener('keydown', e => { this.keys[e.key] = true; });
                window.addEventListener('keyup', e => { this.keys[e.key] = false; });

                // Touch support
                let touchX = null;
                this.container.addEventListener('touchstart', e => {
                    touchX = e.touches[0].clientX;
                });
                this.container.addEventListener('touchmove', e => {
                    if (!touchX) return;
                    let diff = e.touches[0].clientX - touchX;
                    this.playerX += diff * 0.15;
                    touchX = e.touches[0].clientX;
                });
                this.container.addEventListener('touchend', () => { touchX = null; });
            }

            start() {
                this.sounds.init();
                this.sounds.click();
                this.menuScreen.classList.add('hidden');
                this.hudEl.classList.remove('hidden');
                this.resetGameData();
                this.state = 'PLAYING';
                this.loop();
            }

            resetGameData() {
                this.score = 0;
                this.coins = 0;
                this.speed = this.baseSpeed;
                this.fuel = 100;
                this.shieldTime = 0;
                this.playerX = 0;
                this.spawnTimer = 0;
                this.difficultyTimer = 0;

                // Clear existing obstacles
                this.obstacles.forEach(o => o.el.remove());
                this.obstacles = [];
            }

            togglePause() {
                if (this.state === 'PLAYING') {
                    this.state = 'PAUSED';
                    this.pauseScreen.classList.remove('hidden');
                    this.sounds.click();
                } else if (this.state === 'PAUSED') {
                    this.state = 'PLAYING';
                    this.pauseScreen.classList.add('hidden');
                    this.sounds.click();
                    this.loop();
                }
            }

            restart() {
                this.sounds.click();
                this.pauseScreen.classList.add('hidden');
                this.gameOverScreen.classList.add('hidden');
                this.hudEl.classList.remove('hidden');
                this.resetGameData();
                this.state = 'PLAYING';
                this.loop();
            }

            gameOver() {
                this.state = 'GAMEOVER';
                this.sounds.crash();
                this.hudEl.classList.add('hidden');
                this.gameOverScreen.classList.remove('hidden');
                this.finalScoreEl.innerText = Math.floor(this.score);

                this.container.classList.add('shake');
                setTimeout(() => this.container.classList.remove('shake'), 200);

                if (this.score > this.highScore) {
                    this.highScore = Math.floor(this.score);
                    localStorage.setItem('turbo_highscore', this.highScore);
                    this.highScoreValEl.innerText = this.highScore;
                }
            }

            spawnEntity() {
                this.spawnTimer++;
                // Increase spawn rate based on score
                let spawnInterval = Math.max(30, 80 - Math.floor(this.score / 5));

                if (this.spawnTimer > spawnInterval) {
                    this.spawnTimer = 0;
                    let typeRand = Math.random();
                    let lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
                    let xPos = lane * 65; // Lane offset

                    let el = document.createElement('div');
                    let entityType = 'enemy';

                    if (typeRand < 0.25) {
                        entityType = 'coin';
                        el.className = 'coin';
                    } else if (typeRand < 0.35) {
                        entityType = 'powerup';
                        el.className = 'powerup nitro';
                        el.innerText = 'N';
                    } else if (typeRand < 0.4) {
                        entityType = 'powerup';
                        el.className = 'powerup shield';
                        el.innerText = 'S';
                    } else {
                        entityType = 'enemy';
                        el.className = 'enemy-car';
                        el.innerHTML = '<div class="roof"></div><div class="windshield"></div>';
                    }

                    el.style.left = `calc(50% + ${xPos}px - 25px)`;
                    el.style.top = '-100px';
                    this.roadEl.appendChild(el);

                    this.obstacles.push({
                        el: el,
                        x: xPos,
                        y: -100,
                        type: entityType,
                        width: 40,
                        height: entityType === 'enemy' ? 90 : 30
                    });
                }
            }

            update() {
                if (this.state !== 'PLAYING') return;

                // Input handling
                let moveSpeed = 6;
                if (this.keys['ArrowLeft'] || this.keys['a'] || this.keys['A']) this.playerX -= moveSpeed;
                if (this.keys['ArrowRight'] || this.keys['d'] || this.keys['D']) this.playerX += moveSpeed;
                
                // Road boundaries
                let maxRoadOffset = (this.roadEl.clientWidth * 0.6) / 2 - 35;
                this.playerX = Math.max(-maxRoadOffset, Math.min(maxRoadOffset, this.playerX));

                // Speed adjustments
                if (this.keys['ArrowUp'] || this.keys['w'] || this.keys['W']) {
                    this.speed = Math.min(this.maxSpeed, this.speed + 0.1);
                } else if (this.keys['ArrowDown'] || this.keys['s'] || this.keys['S']) {
                    this.speed = Math.max(3, this.speed - 0.1);
                } else {
                    // Friction settle
                    if (this.speed > this.baseSpeed) this.speed -= 0.05;
                }

                // Fuel consumption
                this.fuel -= 0.02;
                if (this.fuel <= 0) {
                    this.gameOver();
                }

                // Shield timer
                if (this.shieldTime > 0) {
                    this.shieldTime--;
                    this.shieldFillEl.style.width = (this.shieldTime / 3) + '%';
                } else {
                    this.shieldFillEl.style.width = '0%';
                }

                // Score progression
                this.score += this.speed * 0.05;
                
                // Difficulty scaling per 10 points (Score chunks)
                let targetMaxSpeed = 12 + Math.floor(this.score / 50) * 2;
                this.maxSpeed = Math.min(22, targetMaxSpeed);

                // Scroll road stripes
                this.roadOffset += this.speed * 2;
                let stripes = this.roadEl.getElementsByClassName('road-stripe');
                for (let stripe of stripes) {
                    let currentTop = parseFloat(stripe.style.top);
                    currentTop += this.speed * 2;
                    if (currentTop > this.roadEl.clientHeight) currentTop = -80;
                    stripe.style.top = currentTop + 'px';
                }

                // Spawn and update obstacles
                this.spawnEntity();

                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    let obs = this.obstacles[i];
                    obs.y += this.speed * 1.5;
                    obs.el.style.top = obs.y + 'px';

                    // Collision Detection (AABB simple logic)
                    let playerRect = { x: this.playerX - 20, y: this.roadEl.clientHeight - 130, w: 40, h: 80 };
                    let obsRect = { x: obs.x - 20, y: obs.y, w: obs.width, h: obs.height };

                    if (
                        playerRect.x < obsRect.x + obsRect.w &&
                        playerRect.x + playerRect.w > obsRect.x &&
                        playerRect.y < obsRect.y + obsRect.h &&
                        playerRect.y + playerRect.h > obsRect.y
                    ) {
                        // Collision triggered!
                        if (obs.type === 'coin') {
                            this.coins++;
                            this.score += 5;
                            this.sounds.coin();
                            obs.el.remove();
                            this.obstacles.splice(i, 1);
                            continue;
                        } else if (obs.type === 'powerup') {
                            this.shieldTime = 300; // 5 seconds approx
                            this.sounds.powerup();
                            obs.el.remove();
                            this.obstacles.splice(i, 1);
                            continue;
                        } else if (obs.type === 'enemy') {
                            if (this.shieldTime > 0) {
                                // Destroy enemy via shield
                                obs.el.remove();
                                this.obstacles.splice(i, 1);
                                continue;
                            } else {
                                this.gameOver();
                                break;
                            }
                        }
                    }

                    // Remove out-of-bounds obstacles
                    if (obs.y > this.roadEl.clientHeight + 100) {
                        obs.el.remove();
                        this.obstacles.splice(i, 1);
                    }
                }

                // Render updates
                this.playerEl.style.transform = `translateX(${this.playerX}px)`;
                this.scoreValEl.innerText = Math.floor(this.score);
                this.coinValEl.innerText = this.coins;
                this.speedValEl.innerText = Math.floor(this.speed * 10);
                this.fuelFillEl.style.width = Math.max(0, this.fuel) + '%';
            }

            loop() {
                if (this.state === 'PLAYING') {
                    this.update();
                    requestAnimationFrame(() => this.loop());
                }
            }
        }

        // Initialize Game Instance
        const game = new Game();
    </script>
</body>
</html>
